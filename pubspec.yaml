name: study_brahmastra
description: "Study Brahmastra - Your ultimate weapon to study smarter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_bloc: ^9.1.1
  lottie: ^3.0.0
  http: ^1.2.0
  flutter_dotenv: ^6.0.1
  flutter_markdown_plus: ^1.0.11
  flutter_markdown_plus_latex: ^1.0.5
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.3.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/splash_animation.json
    - assets/gemini_logo.png
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21 # Required for Android adaptive icons