name: study_brahmastra
description: "Study Brahmastra - Your ultimate weapon to study smarter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0 # Required for Firebase integration[cite: 1]
  firebase_auth: ^5.0.0 # Required for login/signup functionality[cite: 1]
  lottie: ^3.0.0       # Required for splash screen animation[cite: 1]

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/splash_animation.json